name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 15 * * 0" # Every Sunday at 15:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ["oneapi-rs", "Linux"]

    env:
      # Overlay databases do not support manual build tracing.
      CODEQL_ACTION_OVERLAY_ANALYSIS: ${{ matrix.build-mode == 'manual' && 'false' || '' }}

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: rust
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup oneAPI
      uses: ./.github/actions/setup-oneapi

    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build
      run: cargo build --verbose

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        category: "/language:${{ matrix.language }}"
        output: codeql-results

    - name: Upload CodeQL SARIF
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codeql-sarif-${{ matrix.language }}
        path: codeql-results/*.sarif
        if-no-files-found: error
        retention-days: 90
