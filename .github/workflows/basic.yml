name: Basic

on:
  push:
    branches: [ "main" ]
    
  pull_request:
    branches: [ "main" ]

  schedule:
    - cron: "0 16 * * 0" # Every Sunday at 16:00 UTC

  workflow_dispatch:
    inputs:
      deploy_documentation:
        description: Deploy documentation
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ["oneapi-rs", "Linux"]
    
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup oneAPI
      uses: ./.github/actions/setup-oneapi

    - name: Print system info
      run: |
        sycl-ls --verbose

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check C++ formatting
      run: |
        git ls-files -z -- ':(glob)**/*.cpp' ':(glob)**/*.hpp' ':(glob)**/*.h' \
          | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run workspace tests
      run: cargo test --workspace --verbose

    - name: Run examples
      run: |
        for example_path in sycl/sycl-rs/examples/*.rs; do
          example="$(basename "$example_path" .rs)"
          cargo run -p sycl-rs --example "$example" --verbose
        done

    - name: Generate documentation
      run: |
        cargo doc -p sycl-rs --no-deps --verbose
        cat > target/doc/index.html <<'HTML'
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=sycl_rs/">
            <title>sycl-rs documentation</title>
          </head>
          <body>
            <p><a href="sycl_rs/">sycl-rs documentation</a></p>
          </body>
        </html>
        HTML

    - name: Upload documentation artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: documentation
        path: target/doc

  hardening:
    if: github.event_name != 'schedule'
    runs-on: ["oneapi-rs", "Linux"]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup oneAPI
      uses: ./.github/actions/setup-oneapi

    - name: Install nightly toolchain
      run: rustup toolchain install nightly --profile minimal

    - name: Build and test with hardening flags
      env:
        RUSTFLAGS: -Zemit-stack-sizes -Zcf-protection=full
        CARGO_TARGET_DIR: target/hardened
      run: |
        cargo +nightly test --workspace --verbose
        cargo +nightly build --workspace --release --verbose

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    if: github.event_name != 'schedule'
    runs-on: ["oneapi-rs", "Linux"]
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak, thread]
    env:
      CARGO_TARGET_DIR: target/sanitizer-${{ matrix.sanitizer }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup oneAPI
      uses: ./.github/actions/setup-oneapi

    - name: Install nightly toolchain
      run: rustup toolchain install nightly --profile minimal

    - name: Install standard library sources for ThreadSanitizer
      if: matrix.sanitizer == 'thread'
      run: rustup component add rust-src --toolchain nightly

    - name: Run tests with sanitizers
      env:
        # Test only CPU to avoid issues with GPU drivers and sanitizers
        ONEAPI_DEVICE_SELECTOR: opencl:cpu
        # Leave leak detection to the dedicated leak sanitizer job.
        ASAN_OPTIONS: detect_leaks=0
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt
        TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt
        RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
      run: |
        if [ "${{ matrix.sanitizer }}" = thread ]; then
          # Instrument the C++ host shim, not SYCL device code.
          export CXX=icpx
          export CXXFLAGS="-Xarch_host -fsanitize=thread"
        fi
        cargo +nightly test ${{ matrix.sanitizer == 'thread' && '-Zbuild-std' || '' }} \
          --workspace --lib --tests --target x86_64-unknown-linux-gnu --verbose

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest

    permissions:
      contents: write
      security-events: write
      actions: read

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Generate SPDX SBOM with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        format: spdx-json
        output: sbom.spdx.json

    - name: Upload SPDX SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom-spdx
        path: sbom.spdx.json
        if-no-files-found: error

    - name: Submit SPDX SBOM to GitHub dependency graph
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
      with:
        filePath: sbom.spdx.json

    - name: Scan repository with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret,misconfig
        format: sarif
        output: trivy-results.sarif
        exit-code: '1'

    - name: Upload Trivy findings
      if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
      with:
        sarif_file: trivy-results.sarif
        category: trivy

  rustsec:
    name: RustSec audit
    runs-on: ["oneapi-rs", "Linux"]

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Audit dependencies against RustSec
      run: |
        audit_dir="$(mktemp -d "$RUNNER_TEMP/rustsec.XXXXXX")"
        cargo +stable audit --db "$audit_dir/advisory-db" --deny unsound --format sarif > cargo-audit.sarif

    - name: Upload RustSec findings
      # Upload the report even when the audit step fails on findings.
      if: ${{ always() && hashFiles('cargo-audit.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
      with:
        sarif_file: cargo-audit.sarif
        category: rustsec

  deploy-documentation:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_documentation == 'true')
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download documentation artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: documentation
        path: target/doc

    - name: Configure GitHub Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload documentation to GitHub Pages
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: target/doc

    - name: Deploy documentation to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
